# SPDX-License-Identifier: AGPL-3.0-or-later
# Installer builds, uploaded as workflow artifacts. Manual runs always build; pushes to dev only when the commit message
# contains [build], to keep CI runs short. Pushing a tag like v0.1.0 also publishes a GitHub release.
name: installers
on:
  workflow_dispatch:
  push:
    branches: [dev]
    tags: ['v*']

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

env:
  # Optional client IDs: an empty one hides that option in the app.
  GOOGLE_OAUTH_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_DESKTOP_CLIENT_ID }}
  GOOGLE_OAUTH_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_DESKTOP_CLIENT_SECRET }}
  GOOGLE_OAUTH_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_ANDROID_CLIENT_ID }}
  DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
  LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
  LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
  DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}

# Read-only token by default; the release job asks for more itself.
permissions:
  contents: read

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SUFFIX=" >> "$GITHUB_ENV"
          else
            echo "SUFFIX=-test-build" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --console=plain
      - name: Name and checksum
        run: |
          VER=$(grep '^blossom.version=' gradle.properties | cut -d= -f2)
          mkdir out
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            cp "androidApp/build/outputs/apk/release/androidApp-$abi-release.apk" "out/blossom-$VER-android-$abi$SUFFIX.apk"
          done
          (cd out && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: out/

  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[build]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build
        run: ./gradlew :composeApp:packageReleaseMsi :composeApp:createReleaseDistributable --console=plain
      - name: Self-check
        shell: bash
        run: composeApp/build/compose/binaries/main-release/app/blossom/blossom.exe --self-check
      - name: Name and checksum
        shell: bash
        run: |
          VER=$(grep '^blossom.version=' gradle.properties | cut -d= -f2)
          mkdir out
          cp composeApp/build/compose/binaries/main-release/msi/*.msi "out/blossom-$VER-windows-x64.msi"
          (cd composeApp/build/compose/binaries/main-release/app && 7z a -tzip "$GITHUB_WORKSPACE/out/blossom-$VER-windows-x64-portable.zip" blossom > /dev/null)
          (cd out && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: out/

  linux:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-24.04  # the bundled libVLC needs glibc 2.38+
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build
        run: ./gradlew :composeApp:packageReleaseDeb :composeApp:createReleaseDistributable --console=plain
      - name: AppImage
        run: |
          # appimagetool 1.9.1, pinned by checksum.
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          APPDIR=blossom.AppDir
          cp -r composeApp/build/compose/binaries/main-release/app/blossom "$APPDIR"
          # Two malloc arenas: glibc's per-thread arenas cost ~85 MB of mostly empty memory (see Main.kt).
          printf '#!/bin/sh\nexport MALLOC_ARENA_MAX="${MALLOC_ARENA_MAX:-2}"\nexec "$(dirname "$(readlink -f "$0")")/bin/blossom" "$@"\n' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          printf '[Desktop Entry]\nType=Application\nName=blossom\nComment=Music player\nExec=blossom\nIcon=blossom\nCategories=AudioVideo;Audio;Player;\n' > "$APPDIR/blossom.desktop"
          cp composeApp/icons/blossom.png "$APPDIR/blossom.png"
          VER=$(grep '^blossom.version=' gradle.properties | cut -d= -f2)
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" "blossom-$VER-linux-x86_64.AppImage"
      - name: Self-check
        run: |
          VER=$(grep '^blossom.version=' gradle.properties | cut -d= -f2)
          APPIMAGE_EXTRACT_AND_RUN=1 "./blossom-$VER-linux-x86_64.AppImage" --self-check
      - name: Name and checksum
        run: |
          VER=$(grep '^blossom.version=' gradle.properties | cut -d= -f2)
          mkdir out
          cp composeApp/build/compose/binaries/main-release/deb/*.deb "out/blossom_${VER}_amd64.deb"
          mv "blossom-$VER-linux-x86_64.AppImage" out/
          (cd out && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: out/

  ios:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[build]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: Build
        run: |
          VER=$(grep '^blossom.version=' gradle.properties | cut -d= -f2)
          # Unsigned: SideStore/AltStore sign it with the installer's own Apple ID.
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath iosApp/build \
            MARKETING_VERSION="$VER" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package
        run: |
          VER=$(grep '^blossom.version=' gradle.properties | cut -d= -f2)
          mkdir -p Payload out
          cp -R iosApp/build/Build/Products/Release-iphoneos/blossom.app Payload/
          zip -qry "out/blossom-$VER-ios-unsigned.ipa" Payload
          (cd out && shasum -a 256 * > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios
          path: out/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, linux, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for d in android windows linux ios; do mv "out/$d/SHA256SUMS" "out/$d/SHA256SUMS-$d.txt"; done
          # --target: the exact commit, which the app's updater compares against its own (a branch name never matches).
          gh release create "$GITHUB_REF_NAME" out/*/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
